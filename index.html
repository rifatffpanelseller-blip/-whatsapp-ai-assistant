<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>নাম্বার চেকলিস্ট</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1a1d21;--muted:#6b7280;--line:#e5e7eb;--accent:#16a34a;--accentbg:#dcfce7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111315;--card:#1b1e22;--text:#e8eaed;--muted:#9aa0a6;--line:#2c3036;--accent:#4ade80;--accentbg:#14301f}}
:root[data-theme="dark"]{--bg:#111315;--card:#1b1e22;--text:#e8eaed;--muted:#9aa0a6;--line:#2c3036;--accent:#4ade80;--accentbg:#14301f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:12px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:5}
h1{font-size:20px;margin:0 0 6px}
.stat{color:var(--muted);font-size:14px;margin-bottom:8px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:16px;box-sizing:border-box}
.tabs{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;cursor:pointer}
button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
ul{list-style:none;margin:8px 0 0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px;cursor:pointer;-webkit-tap-highlight-color:transparent}
li.done{background:var(--accentbg)}
li.done .num{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--accent);flex:none}
.idx{color:var(--muted);font-size:12px;width:28px;flex:none;text-align:right}
.num{flex:1;font-size:17px;font-variant-numeric:tabular-nums}
.cp{padding:5px 10px;font-size:12px}
.foot{display:flex;justify-content:center;margin:16px 0}
li{gap:8px}
.ic{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;flex:none;border:0;padding:0;color:#fff;font-weight:700;font-size:12px;text-decoration:none;cursor:pointer}
.wa{background:#25d366}
.imo{background:#1a8cff;font-size:11px;font-style:italic}
.cp{padding:5px 8px;font-size:14px}
textarea{width:100%;box-sizing:border-box;margin-top:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:14px;resize:vertical;min-height:64px}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
li{flex-wrap:wrap}
.ticks{flex-basis:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;padding-left:36px;font-size:13px}
.ticks label{align-items:flex-start}
.ticks label{display:flex;align-items:center;gap:6px;cursor:pointer}
.ticks input{width:20px;height:20px}
.warn{display:block;font-size:11px;color:#d97706;font-weight:600}
li.bad .wa{opacity:.55}
.wb{position:relative;background:#0b6b5e}
.bz{position:absolute;right:-3px;bottom:-3px;background:#fff;color:#0b6b5e;border-radius:50%;width:15px;height:15px;font-size:10px;line-height:15px;text-align:center;font-style:normal}
.ic{width:32px;height:32px}
.add{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.add summary{cursor:pointer;font-weight:600}
.add button{margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>📞 নাম্বার চেকলিস্ট</h1>
<div class="stat" id="stat"></div>
<div class="bar"><i id="bar"></i></div>
<input type="search" id="q" placeholder="নাম্বার খুঁজুন…">
<textarea id="msg" placeholder="পাঠানোর মেসেজ"></textarea>
<div class="hint">WhatsApp বোতামে চাপলে এই মেসেজসহ চ্যাট খুলবে। imo বোতামে চাপলে মেসেজ কপি হয়ে imo অ্যাপ খুলবে, সেখানে পেস্ট করুন।</div>
<div class="tabs">
<button data-f="all" class="on">সব</button>
<button data-f="todo">বাকি</button>
<button data-f="done">ব্যবহৃত</button>
</div>
</header>
<details class="add"><summary>➕ নতুন নাম্বার যোগ করুন</summary><textarea id="newnums" placeholder="এখানে নাম্বার পেস্ট করুন, প্রতি লাইনে একটা"></textarea><button id="addbtn">যোগ করুন</button> <span id="addmsg" class="hint"></span></details>
<ul id="list"></ul>
<div class="foot"><button id="reset">সব টিক মুছুন</button></div>
</div>
<script>
const RAW=`+88 01907335495

let extra=[];
try{extra=JSON.parse(localStorage.getItem("numchecklist-extra")||"[]")}catch(e){}
let NUMS=[...new Set(RAW.split("\n").concat(extra).map(s=>s.trim()).filter(Boolean))];
const KEY="numchecklist-v1";
let done=new Set(),filter="all",term="";
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
let W=new Set(),I=new Set();
try{W=new Set(JSON.parse(localStorage.getItem("numchecklist-w")||"[]"));I=new Set(JSON.parse(localStorage.getItem("numchecklist-i")||"[]"))}catch(e){}
let NI=new Set(),NW=new Set(),IO=new Set(),WO=new Set();
try{NI=new Set(JSON.parse(localStorage.getItem("numchecklist-ni")||"[]"));NW=new Set(JSON.parse(localStorage.getItem("numchecklist-nw")||"[]"));IO=new Set(JSON.parse(localStorage.getItem("numchecklist-io")||"[]"));WO=new Set(JSON.parse(localStorage.getItem("numchecklist-wo")||"[]"))}catch(e){}
function setOf(k){return {w:W,i:I,ni:NI,nw:NW,io:IO,wo:WO}[k]}
const ALL=[W,I,NI,NW];
function isDone(n){return ALL.every(s=>s.has(n))}
const TLAB2=[["i","imo-তে নক দিয়েছি"],["ni","imo-তে পাই নাই"],["w","WhatsApp-এ নক দিয়েছি"],["nw","WhatsApp-এ পাই নাই"],["io","imo-তে পেয়েছি, WhatsApp-এ পাই নাই"],["wo","WhatsApp-এ পেয়েছি, imo-তে পাই নাই"]];
const TLAB=[["i","imo-তে নক দিয়েছি"],["w","WhatsApp-এ নক দিয়েছি"],["ni","imo-তে পাই নাই"],["nw","WhatsApp-এ পাই নাই"],["io","imo-তে পেয়েছি, WhatsApp-এ পাই নাই"]];
function ticksHtml(n){return '<div class="ticks">'+TLAB2.slice(0,4).map(([k,t])=>'<label><input type="checkbox" data-k="'+k+'"'+(setOf(k).has(n)?" checked":"")+'> '+t+'</label>').join("")+'</div>'}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...done]));localStorage.setItem("numchecklist-w",JSON.stringify([...W]));localStorage.setItem("numchecklist-i",JSON.stringify([...I]));localStorage.setItem("numchecklist-ni",JSON.stringify([...NI]));localStorage.setItem("numchecklist-nw",JSON.stringify([...NW]));localStorage.setItem("numchecklist-io",JSON.stringify([...IO]));localStorage.setItem("numchecklist-wo",JSON.stringify([...WO]))}catch(e){}}
const DEFAULT_MSG="আসসালামু আলাইকুম ভাই, 9 উইকেট থেকে অনলাইন মাস্টারে আদিন খান বলছি।";
let MSG=DEFAULT_MSG;
try{MSG=localStorage.getItem("numchecklist-msg")||DEFAULT_MSG}catch(e){}
const msgEl=document.getElementById("msg");
msgEl.value=MSG;
msgEl.oninput=()=>{MSG=msgEl.value;try{localStorage.setItem("numchecklist-msg",MSG)}catch(e){}render()};
const FRAMED=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const IS_AND=/Android/i.test(navigator.userAgent);function imoUrl(){return IS_AND?"intent:#Intent;action=android.intent.action.SEND;type=text/plain;package=com.imo.android.imoim;S.android.intent.extra.TEXT="+encodeURIComponent(MSG)+";end":"imo://"}
function intl(n){const d=n.replace(/\D/g,"");if(d.startsWith("88"))return d;if(d.startsWith("0"))return "88"+d;return d}
function valid(n){return /^8801\d{9}$/.test(intl(n))}
const WA_SVG='<svg viewBox="0 0 24 24" width="20" height="20" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.700 6.700 0 0 1-3.300-2.900c-.2-.4.200-.4.700-1.300.1-.2 0-.3 0-.5l-.8-1.800c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.200c0 1.300.9 2.500 1 2.700.1.200 1.800 2.800 4.400 3.900 1.600.7 2.300.7 3.100.6.500-.1 1.500-.6 1.700-1.200.2-.6.2-1.100.2-1.200-.1-.1-.3-.2-.5-.3z"/></svg>';
function waLink(n,pkg){const p=intl(n),t=encodeURIComponent(MSG);return IS_AND?"intent://send?phone="+p+"&text="+t+"#Intent;scheme=whatsapp;package="+pkg+";end":"https://wa.me/"+p+"?text="+t}
function waBtns(n){return '<a class="ic wa" target="_blank" rel="noopener" title="WhatsApp" href="'+waLink(n,"com.whatsapp")+'">'+WA_SVG+'</a><a class="ic wa wb" target="_blank" rel="noopener" title="WhatsApp Business" href="'+waLink(n,"com.whatsapp.w4b")+'">'+WA_SVG+'<b class="bz">B</b></a>'}
const list=document.getElementById("list");
function render(){
  const t=term.replace(/[\s\-+]/g,"");
  list.innerHTML="";
  NUMS.forEach((n,i)=>{
    const d=isDone(n);
    if(filter==="todo"&&d)return;
    if(filter==="done"&&!d)return;
    if(t&&!n.replace(/[\s\-+]/g,"").includes(t))return;
    const li=document.createElement("li");
    if(d)li.className="done";
    if(!valid(n))li.className+=" bad";
    li.innerHTML='<span class="idx">'+(i+1)+'</span><span class="num">'+n+(valid(n)?'':'<small class="warn">⚠ অসম্পূর্ণ নাম্বার, WhatsApp নাও খুলতে পারে</small>')+'</span>'+waBtns(n)+'<a class="ic imo" target="_blank" rel="noopener" title="imo" href="'+imoUrl()+'">imo</a><button class="cp" title="নাম্বার কপি">📋</button>'+ticksHtml(n)+'';
    if(!FRAMED)li.querySelectorAll("a.ic").forEach(a=>a.removeAttribute("target"));
    li.onclick=e=>{
      if(e.target.closest(".wa"))return;
      if(e.target.closest(".imo")){
        try{navigator.clipboard.writeText(MSG)}catch(x){}
        const b=e.target.closest(".imo");b.textContent="✓";setTimeout(()=>b.textContent="imo",1200);return;
      }
      if(e.target.classList.contains("cp")){
        try{navigator.clipboard.writeText(n)}catch(x){}
        e.target.textContent="✓";setTimeout(()=>e.target.textContent="📋",900);return;
      }
      const cb=e.target.closest("input[data-k]");
      if(cb){const s=setOf(cb.dataset.k);cb.checked?s.add(n):s.delete(n);save();render();}
    };
    list.appendChild(li);
  });
  const c=NUMS.filter(isDone).length;
  document.getElementById("stat").textContent="ব্যবহৃত: "+c+" / "+NUMS.length+" · বাকি: "+(NUMS.length-c)+" · WhatsApp: "+W.size+" · imo: "+I.size;
  document.getElementById("bar").style.width=(c/NUMS.length*100)+"%";
}
document.getElementById("q").oninput=e=>{term=e.target.value;render()};
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");filter=b.dataset.f;render();
});
document.getElementById("reset").onclick=()=>{if(confirm("সব টিক মুছে ফেলবেন?")){done.clear();W.clear();I.clear();NI.clear();NW.clear();IO.clear();WO.clear();save();render()}};
document.getElementById("addbtn").onclick=()=>{
  const box=document.getElementById("newnums");
  const items=box.value.split(/[\n,;]+/).map(s=>s.trim()).filter(Boolean);
  let added=0,dup=0;
  items.forEach(n=>{if(NUMS.includes(n)||extra.includes(n)){dup++}else{extra.push(n);NUMS.push(n);added++}});
  try{localStorage.setItem("numchecklist-extra",JSON.stringify(extra))}catch(e){}
  box.value="";
  document.getElementById("addmsg").textContent=added+"টা যোগ হয়েছে"+(dup?", "+dup+"টা আগে থেকেই ছিল":"");
  render();
};
render();
</script>
